name: Doubleclick
description: >-
  DoubleClick was a pioneering digital advertising technology company founded in 1995 and backed by
  Canaan Partners; it went public in 1998 and was acquired by Google in 2007-2008. Its products were
  absorbed into what is now the Google Marketing Platform: DoubleClick Campaign Manager became Campaign
  Manager 360, DoubleClick for Publishers (DFP) became Google Ad Manager, and DoubleClick Bid Manager
  became Display & Video 360. DoubleClick no longer operates as an independent company and maintains no
  independent developer portal, website, or API host of its own. The surviving developer/API lineage
  (dfareporting / doubleclick-advertisers) is served entirely through Google's developer platform. This
  profile is retained as a historical portfolio-lead record; there is no independent provider surface to
  enrich.
